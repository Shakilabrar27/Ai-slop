<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pageGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="pageGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Windows 11 App Icon Base Rounded Rect -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="100" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />
  
  <!-- Subtle inner glass glow -->
  <path d="M60 60 Q256 120 452 60 L452 200 Q256 260 60 200 Z" fill="url(#glowGrad)" opacity="0.3" />
  
  <!-- Open Book Wings -->
  <!-- Left Page -->
  <path d="M112 168 C160 156 216 160 250 188 L250 376 C216 348 160 344 112 356 Z" fill="url(#pageGrad1)" />
  <!-- Left Page Sheen -->
  <path d="M120 180 C160 170 208 174 240 196 L240 216 C208 194 160 190 120 200 Z" fill="#ffffff" opacity="0.6" />
  
  <!-- Right Page -->
  <path d="M400 168 C352 156 296 160 262 188 L262 376 C296 348 352 344 400 356 Z" fill="url(#pageGrad2)" />
  <!-- Right Page Lines -->
  <line x1="285" y1="230" x2="375" y2="218" stroke="#64748b" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  <line x1="285" y1="260" x2="375" y2="248" stroke="#64748b" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  <line x1="285" y1="290" x2="345" y2="278" stroke="#64748b" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  
  <!-- Spine Book Ribbon & Bookmark -->
  <path d="M256 140 L256 384" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />
  <path d="M246 130 L266 130 L266 220 L256 205 L246 220 Z" fill="#38bdf8" />
  
  <!-- Lumina Sparkle -->
  <circle cx="256" cy="120" r="10" fill="#ffffff" />
  <path d="M256 95 L256 145 M231 120 L281 120" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
</svg>
